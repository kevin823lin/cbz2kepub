# 新版 wrapper 的設定範例；請先換成自己的來源與漫畫名。
# 複製為個人的 config.toml 後調整路徑；不要提交個人設定。

[batch]
comics = [
    { title = "範例漫畫 A", spreadshift = false, chapter_pairing = true },
    # { title = "範例漫畫 B", spreadshift = true, chapter_pairing = true },
    # { title = "範例漫畫 C", spreadshift = false, chapter_pairing = true },
]

[paths]
# 來源：input_root/<title>/compressed/*.cbz
# 相對路徑以本設定檔的所在目錄為基準。
input_root = "./input"
output_dir = "./output"
# 省略此行時使用專案根目錄下的 .cbz2kepub-work，即使設定檔放在別處。
work_root = "./.cbz2kepub-work"

[conversion]
profile = "KoLC"
manga_style = true
upscale = true
forcecolor = true
eraserainbow = true
cropping = 2

[publication]
# false：預檢通過後先刪本作品的舊卷；轉檔失敗無法還原舊卷。
keep_backup = true
